<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="200" height="200" fill="#f8f9fa"/>
  
  <!-- 表带 -->
  <rect x="85" y="20" width="30" height="40" fill="#2c3e50" rx="15"/>
  <rect x="85" y="140" width="30" height="40" fill="#2c3e50" rx="15"/>
  
  <!-- 表身 -->
  <rect x="70" y="60" width="60" height="80" fill="#34495e" rx="20"/>
  
  <!-- 屏幕 -->
  <rect x="75" y="65" width="50" height="70" fill="#000" rx="15"/>
  
  <!-- 屏幕内容 -->
  <circle cx="100" cy="85" r="8" fill="#3498db"/>
  <rect x="90" y="95" width="20" height="3" fill="#2ecc71" rx="1"/>
  <rect x="85" y="105" width="30" height="3" fill="#e74c3c" rx="1"/>
  <rect x="88" y="115" width="24" height="3" fill="#f39c12" rx="1"/>
  
  <!-- 数字表冠 -->
  <rect x="130" y="85" width="8" height="15" fill="#7f8c8d" rx="4"/>
  
  <!-- 侧边按钮 -->
  <rect x="130" y="105" width="6" height="8" fill="#7f8c8d" rx="3"/>
  
  <!-- 品牌标识 -->
  <text x="100" y="175" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Apple Watch</text>
</svg>