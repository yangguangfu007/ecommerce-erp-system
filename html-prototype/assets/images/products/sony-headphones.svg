<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headphoneGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 头带 -->
  <path d="M 60 40 Q 100 20 140 40" fill="none" stroke="url(#headphoneGradient)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 头带内侧 -->
  <path d="M 65 45 Q 100 30 135 45" fill="none" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 左耳罩 -->
  <circle cx="70" cy="80" r="25" fill="url(#headphoneGradient)" stroke="#333" stroke-width="2"/>
  <circle cx="70" cy="80" r="20" fill="#1a1a1a"/>
  <circle cx="70" cy="80" r="15" fill="#333"/>
  
  <!-- 右耳罩 -->
  <circle cx="130" cy="80" r="25" fill="url(#headphoneGradient)" stroke="#333" stroke-width="2"/>
  <circle cx="130" cy="80" r="20" fill="#1a1a1a"/>
  <circle cx="130" cy="80" r="15" fill="#333"/>
  
  <!-- 连接臂 -->
  <rect x="67" y="55" width="6" height="25" rx="3" ry="3" fill="url(#headphoneGradient)"/>
  <rect x="127" y="55" width="6" height="25" rx="3" ry="3" fill="url(#headphoneGradient)"/>
  
  <!-- 音量控制 -->
  <rect x="45" y="75" width="8" height="3" rx="1" ry="1" fill="#666"/>
  <rect x="45" y="80" width="8" height="3" rx="1" ry="1" fill="#666"/>
  <rect x="45" y="85" width="8" height="3" rx="1" ry="1" fill="#666"/>
  
  <!-- 电源按钮 -->
  <circle cx="155" cy="80" r="4" fill="#0078d4"/>
  
  <!-- 品牌标识 -->
  <text x="100" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">SONY</text>
  <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">WH-1000XM5</text>
</svg>