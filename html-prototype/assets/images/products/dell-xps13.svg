<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dellGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 笔记本底座 -->
  <rect x="15" y="115" width="170" height="65" rx="8" ry="8" fill="url(#dellGradient)" stroke="#888" stroke-width="1"/>
  
  <!-- 屏幕 -->
  <rect x="25" y="25" width="150" height="100" rx="8" ry="8" fill="#1a1a1a" stroke="#555" stroke-width="1"/>
  
  <!-- 屏幕内容 -->
  <rect x="30" y="30" width="140" height="90" rx="5" ry="5" fill="#000"/>
  
  <!-- Windows桌面 -->
  <rect x="35" y="35" width="130" height="80" rx="3" ry="3" fill="#0078d4"/>
  
  <!-- 任务栏 -->
  <rect x="35" y="105" width="130" height="10" fill="#1f1f1f"/>
  
  <!-- 开始按钮 -->
  <rect x="38" y="107" width="8" height="6" fill="#0078d4"/>
  
  <!-- 应用图标 -->
  <g fill="#fff" opacity="0.8">
    <rect x="50" y="50" width="15" height="15" rx="2"/>
    <rect x="70" y="50" width="15" height="15" rx="2"/>
    <rect x="90" y="50" width="15" height="15" rx="2"/>
    <rect x="110" y="50" width="15" height="15" rx="2"/>
    <rect x="130" y="50" width="15" height="15" rx="2"/>
  </g>
  
  <!-- 键盘 -->
  <rect x="30" y="130" width="140" height="40" rx="3" ry="3" fill="#f5f5f5"/>
  
  <!-- 键盘按键 -->
  <g fill="#e0e0e0" stroke="#ccc" stroke-width="0.5">
    <rect x="35" y="135" width="8" height="6" rx="1"/>
    <rect x="45" y="135" width="8" height="6" rx="1"/>
    <rect x="55" y="135" width="8" height="6" rx="1"/>
    <rect x="65" y="135" width="8" height="6" rx="1"/>
    <rect x="75" y="135" width="8" height="6" rx="1"/>
    <rect x="85" y="135" width="8" height="6" rx="1"/>
    <rect x="95" y="135" width="8" height="6" rx="1"/>
    <rect x="105" y="135" width="8" height="6" rx="1"/>
    <rect x="115" y="135" width="8" height="6" rx="1"/>
    <rect x="125" y="135" width="8" height="6" rx="1"/>
    <rect x="135" y="135" width="8" height="6" rx="1"/>
    <rect x="145" y="135" width="8" height="6" rx="1"/>
    <rect x="155" y="135" width="8" height="6" rx="1"/>
  </g>
  
  <!-- 触控板 -->
  <rect x="85" y="150" width="30" height="20" rx="3" ry="3" fill="#e8e8e8" stroke="#ccc" stroke-width="1"/>
  
  <!-- DELL标识 -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Dell XPS 13</text>
</svg>