<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ipadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- iPad外框 -->
  <rect x="50" y="20" width="100" height="140" rx="15" ry="15" fill="url(#ipadGradient)" stroke="#ccc" stroke-width="2"/>
  
  <!-- 屏幕 -->
  <rect x="60" y="35" width="80" height="110" rx="8" ry="8" fill="#000"/>
  
  <!-- 屏幕内容 -->
  <rect x="65" y="40" width="70" height="100" rx="5" ry="5" fill="#1e90ff"/>
  
  <!-- 应用图标网格 -->
  <g fill="#fff" opacity="0.8">
    <rect x="70" y="50" width="12" height="12" rx="2"/>
    <rect x="85" y="50" width="12" height="12" rx="2"/>
    <rect x="100" y="50" width="12" height="12" rx="2"/>
    <rect x="115" y="50" width="12" height="12" rx="2"/>
    
    <rect x="70" y="65" width="12" height="12" rx="2"/>
    <rect x="85" y="65" width="12" height="12" rx="2"/>
    <rect x="100" y="65" width="12" height="12" rx="2"/>
    <rect x="115" y="65" width="12" height="12" rx="2"/>
    
    <rect x="70" y="80" width="12" height="12" rx="2"/>
    <rect x="85" y="80" width="12" height="12" rx="2"/>
    <rect x="100" y="80" width="12" height="12" rx="2"/>
    <rect x="115" y="80" width="12" height="12" rx="2"/>
  </g>
  
  <!-- Dock -->
  <rect x="70" y="120" width="60" height="15" rx="7" ry="7" fill="#333" opacity="0.3"/>
  <rect x="75" y="123" width="8" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="86" y="123" width="8" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="97" y="123" width="8" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="108" y="123" width="8" height="8" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="119" y="123" width="8" height="8" rx="2" fill="#fff" opacity="0.8"/>
  
  <!-- Home按钮 -->
  <circle cx="100" cy="155" r="6" fill="#333" stroke="#666" stroke-width="1"/>
  
  <!-- 品牌标识 -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">iPad Air</text>
</svg>