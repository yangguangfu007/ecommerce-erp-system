<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="surfaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 平板主体 -->
  <rect x="40" y="30" width="120" height="90" rx="8" ry="8" fill="url(#surfaceGradient)" stroke="#bbb" stroke-width="2"/>
  
  <!-- 屏幕 -->
  <rect x="45" y="35" width="110" height="80" rx="5" ry="5" fill="#000"/>
  
  <!-- 屏幕内容 -->
  <rect x="50" y="40" width="100" height="70" rx="3" ry="3" fill="#0078d4"/>
  
  <!-- Windows开始菜单 -->
  <rect x="55" y="45" width="90" height="60" rx="2" ry="2" fill="#1e1e1e"/>
  
  <!-- 磁贴 -->
  <g fill="#0078d4">
    <rect x="60" y="50" width="15" height="15" rx="1"/>
    <rect x="78" y="50" width="15" height="15" rx="1"/>
    <rect x="96" y="50" width="15" height="15" rx="1"/>
    <rect x="114" y="50" width="15" height="15" rx="1"/>
  </g>
  
  <g fill="#00bcf2">
    <rect x="60" y="68" width="15" height="15" rx="1"/>
    <rect x="78" y="68" width="15" height="15" rx="1"/>
    <rect x="96" y="68" width="15" height="15" rx="1"/>
    <rect x="114" y="68" width="15" height="15" rx="1"/>
  </g>
  
  <g fill="#ffb900">
    <rect x="60" y="86" width="15" height="15" rx="1"/>
    <rect x="78" y="86" width="15" height="15" rx="1"/>
    <rect x="96" y="86" width="15" height="15" rx="1"/>
    <rect x="114" y="86" width="15" height="15" rx="1"/>
  </g>
  
  <!-- 支架 -->
  <rect x="120" y="125" width="40" height="4" rx="2" ry="2" fill="#999"/>
  <rect x="135" y="125" width="4" height="25" rx="2" ry="2" fill="#999"/>
  
  <!-- 键盘盖 -->
  <rect x="30" y="135" width="140" height="45" rx="5" ry="5" fill="#333"/>
  
  <!-- 键盘 -->
  <rect x="35" y="140" width="130" height="35" rx="3" ry="3" fill="#2a2a2a"/>
  
  <!-- 键盘按键 -->
  <g fill="#444" stroke="#555" stroke-width="0.3">
    <rect x="40" y="145" width="6" height="5" rx="1"/>
    <rect x="48" y="145" width="6" height="5" rx="1"/>
    <rect x="56" y="145" width="6" height="5" rx="1"/>
    <rect x="64" y="145" width="6" height="5" rx="1"/>
    <rect x="72" y="145" width="6" height="5" rx="1"/>
    <rect x="80" y="145" width="6" height="5" rx="1"/>
    <rect x="88" y="145" width="6" height="5" rx="1"/>
    <rect x="96" y="145" width="6" height="5" rx="1"/>
    <rect x="104" y="145" width="6" height="5" rx="1"/>
    <rect x="112" y="145" width="6" height="5" rx="1"/>
    <rect x="120" y="145" width="6" height="5" rx="1"/>
    <rect x="128" y="145" width="6" height="5" rx="1"/>
    <rect x="136" y="145" width="6" height="5" rx="1"/>
    <rect x="144" y="145" width="6" height="5" rx="1"/>
    <rect x="152" y="145" width="6" height="5" rx="1"/>
  </g>
  
  <!-- 触控板 -->
  <rect x="85" y="160" width="30" height="15" rx="2" ry="2" fill="#1a1a1a"/>
  
  <!-- 品牌标识 -->
  <text x="100" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">Surface Pro 9</text>
</svg>