<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mouseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 鼠标主体 -->
  <ellipse cx="100" cy="90" rx="35" ry="50" fill="url(#mouseGradient)" stroke="#333" stroke-width="2"/>
  
  <!-- 左键 -->
  <path d="M 75 60 Q 87 45 100 60 L 100 85 Q 87 70 75 85 Z" fill="#555" stroke="#333" stroke-width="1"/>
  
  <!-- 右键 -->
  <path d="M 100 60 Q 113 45 125 60 L 125 85 Q 113 70 100 85 Z" fill="#555" stroke="#333" stroke-width="1"/>
  
  <!-- 滚轮 -->
  <rect x="97" y="55" width="6" height="15" rx="3" ry="3" fill="#666" stroke="#333" stroke-width="1"/>
  
  <!-- 滚轮纹理 -->
  <g stroke="#888" stroke-width="0.5">
    <line x1="98" y1="58" x2="102" y2="58"/>
    <line x1="98" y1="61" x2="102" y2="61"/>
    <line x1="98" y1="64" x2="102" y2="64"/>
    <line x1="98" y1="67" x2="102" y2="67"/>
  </g>
  
  <!-- DPI按钮 -->
  <circle cx="100" cy="75" r="2" fill="#0078d4"/>
  
  <!-- 侧键 -->
  <rect x="70" y="80" width="4" height="8" rx="2" ry="2" fill="#666"/>
  <rect x="70" y="90" width="4" height="8" rx="2" ry="2" fill="#666"/>
  
  <!-- 底部 -->
  <ellipse cx="100" cy="130" rx="30" ry="15" fill="#1a1a1a"/>
  
  <!-- 传感器 -->
  <circle cx="100" cy="130" r="4" fill="#dc143c"/>
  
  <!-- 脚垫 -->
  <ellipse cx="85" cy="125" rx="3" ry="2" fill="#333"/>
  <ellipse cx="115" cy="125" rx="3" ry="2" fill="#333"/>
  <ellipse cx="85" cy="135" rx="3" ry="2" fill="#333"/>
  <ellipse cx="115" cy="135" rx="3" ry="2" fill="#333"/>
  
  <!-- 品牌标识 -->
  <text x="100" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Logitech</text>
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">MX Master 3S</text>
</svg>