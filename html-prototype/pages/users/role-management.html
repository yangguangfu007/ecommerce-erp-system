    <!-- JavaScript Files --><script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/components.js"></script>
    <script src="../../assets/js/mock-data.js"></script>
    <script src="../../assets/js/app.js"></script>
    <script>
        // 角色管理页面逻辑
        document.addEventListener('DOMContentLoaded', function() {
            loadRoleList();
        });

        // 加载角色列表
        function loadRoleList() {
            const roleGrid = document.getElementById('roleGrid');
            if (!roleGrid) return;

            const roles = mockData.roles;
            
            roleGrid.innerHTML = roles.map(role => `
                <div class="role-card">
                    <div class="role-header">
                        <h4 class="role-name">${role.name}</h4>
                        <span class="role-code">${role.code}</span>
                    </div>
                    <div class="role-description">
                        ${role.description}
                    </div>
                    <div class="role-permissions">
                        <div class="permission-count">
                            权限数量: ${role.permissions.length}
                        </div>
                        <div class="permission-list">
                            ${role.permissions.slice(0, 3).map(p => `<span class="permission-tag">${p}</span>`).join('')}
                            ${role.permissions.length > 3 ? `<span class="permission-more">+${role.permissions.length - 3}</span>` : ''}
                        </div>
                    </div>
                    <div class="role-actions">
                        <button class="btn btn-small btn-primary" onclick="editRole(${role.id})">编辑</button>
                        <button class="btn btn-small btn-outline" onclick="viewPermissions(${role.id})">权限</button>
                        <button class="btn btn-small btn-danger" onclick="deleteRole(${role.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 刷新角色列表
        function refreshRoleList() {
            showToast('正在刷新角色列表...', 'info');
            loadRoleList();
        }

        // 添加角色
        function addRole() {
            showToast('添加角色功能开发中...', 'info');
        }

        // 编辑角色
        function editRole(roleId) {
            showToast(`编辑角色 ${roleId} 功能开发中...`, 'info');
        }

        // 查看权限
        function viewPermissions(roleId) {
            showToast(`查看角色 ${roleId} 权限功能开发中...`, 'info');
        }

        // 删除角色
        function deleteRole(roleId) {
            showConfirm(
                '确定要删除这个角色吗？删除后将无法恢复。',
                () => {
                    showToast('删除成功', 'success');
                }
            );
        }
    </script>
