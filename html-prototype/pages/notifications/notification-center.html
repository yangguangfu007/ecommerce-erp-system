    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadNotifications();
        });

        function loadNotifications() {
            const notificationList = document.getElementById('notificationList');
            if (!notificationList) return;

            const notifications = mockData.notifications;
            
            notificationList.innerHTML = notifications.map(notification => `
                <div class="notification-item ${notification.isRead ? 'read' : 'unread'}">
                    <div class="notification-icon ${notification.type}">
                        <i class="fas fa-${getNotificationIcon(notification.type)}"></i>
                    </div>
                    <div class="notification-content">
                        <h4 class="notification-title">${notification.title}</h4>
                        <p class="notification-text">${notification.content}</p>
                        <span class="notification-time">${notification.createdAt}</span>
                    </div>
                    <div class="notification-actions">
                        ${!notification.isRead ? `<button class="btn btn-small btn-outline" onclick="markAsRead(${notification.id})">标记已读</button>` : ''}
                        <button class="btn btn-small btn-text" onclick="deleteNotification(${notification.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function getNotificationIcon(type) {
            const iconMap = {
                'warning': 'exclamation-triangle',
                'info': 'info-circle',
                'error': 'times-circle',
                'success': 'check-circle',
                'system': 'cog'
            };
            return iconMap[type] || 'bell';
        }

        function markAllRead() {
            showToast('全部标记为已读', 'success');
            loadNotifications();
        }

        function markAsRead(notificationId) {
            showToast('标记为已读', 'success');
            loadNotifications();
        }

        function deleteNotification(notificationId) {
            showToast('通知已删除', 'success');
            loadNotifications();
        }

        function refreshNotifications() {
            showToast('正在刷新通知...', 'info');
            loadNotifications();
        }
    </script>
