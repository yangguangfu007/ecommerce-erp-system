<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商ERP管理系统 - 登录</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/pages.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <link rel="stylesheet" href="assets/css/themes.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="assets/images/logo.svg" alt="ERP系统" class="login-logo">
                <h1 class="login-title">电商ERP管理系统</h1>
                <p class="login-subtitle">请登录您的账户</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="username" name="username" class="form-input" placeholder="请输入用户名"
                            value="admin" required>
                    </div>
                    <div class="form-error" style="display: none;"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码"
                            value="admin123" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-error" style="display: none;"></div>
                </div>

                <div class="form-options">
                    <label class="checkbox-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-label">记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>

                <button type="submit" class="btn btn-primary btn-login">
                    <span class="btn-text">登录</span>
                    <div class="btn-loading" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>登录中...</span>
                    </div>
                </button>


            </form>

            <div class="login-footer">
                <p>&copy; 2025 电商ERP管理系统. 保留所有权利.</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/mock-data.js"></script>

    <script>
        // 简化的登录处理逻辑
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('loginForm');

            if (loginForm) {
                loginForm.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;
                    const remember = document.getElementById('remember').checked;

                    // 基本验证
                    if (!username || !password) {
                        showToast('请输入用户名和密码', 'error');
                        return;
                    }

                    // 显示加载状态
                    const submitBtn = document.querySelector('.btn-login');
                    const btnText = submitBtn.querySelector('.btn-text');
                    const btnLoading = submitBtn.querySelector('.btn-loading');

                    btnText.style.display = 'none';
                    btnLoading.style.display = 'flex';
                    submitBtn.disabled = true;

                    try {
                        const response = await mockApi.login(username, password);

                        if (response.success) {
                            // 保存登录信息
                            Utils.Storage.set('userToken', response.data.token);
                            Utils.Storage.set('userInfo', response.data.user);

                            if (remember) {
                                Utils.Storage.set('rememberLogin', true);
                            }

                            showToast('登录成功！正在跳转...', 'success');

                            // 跳转到仪表板
                            setTimeout(() => {
                                window.location.href = 'dashboard.html';
                            }, 1000);

                        } else {
                            showToast(response.message || '登录失败', 'error');
                        }

                    } catch (error) {
                        console.error('Login error:', error);
                        showToast('登录失败，请稍后重试', 'error');
                    } finally {
                        // 恢复按钮状态
                        btnText.style.display = 'inline';
                        btnLoading.style.display = 'none';
                        submitBtn.disabled = false;
                    }
                });
            }
        });

        // 密码显示/隐藏切换
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.password-toggle i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleButton.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleButton.className = 'fas fa-eye';
            }
        }
    </script>
</body>

</html>
