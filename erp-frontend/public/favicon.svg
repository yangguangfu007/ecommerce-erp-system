<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景圆形 -->
  <circle cx="8" cy="8" r="7" fill="url(#faviconGradient)" stroke="#2563eb" stroke-width="0.5"/>
  
  <!-- 简化的ERP符号 -->
  <!-- E -->
  <rect x="3" y="4.5" width="3" height="0.8" fill="white" rx="0.2"/>
  <rect x="3" y="4.5" width="0.8" height="3" fill="white" rx="0.2"/>
  <rect x="3" y="7" width="2.2" height="0.8" fill="white" rx="0.2"/>
  <rect x="3" y="9.5" width="3" height="0.8" fill="white" rx="0.2"/>
  
  <!-- R -->
  <rect x="6.5" y="4.5" width="0.8" height="5.8" fill="white" rx="0.2"/>
  <path d="M6.5 4.5 L9.5 4.5 Q10.2 4.5 10.2 5.5 L10.2 6.2 Q10.2 7 9.5 7 L7.3 7" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <line x1="8" y1="7" x2="9.5" y2="10.3" stroke="white" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- P -->
  <rect x="10.5" y="4.5" width="0.8" height="5.8" fill="white" rx="0.2"/>
  <path d="M10.5 4.5 L13 4.5 Q13.7 4.5 13.7 5.5 L13.7 6.2 Q13.7 7 13 7 L11.3 7" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  
  <!-- 装饰点 -->
  <circle cx="4" cy="12" r="0.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="8" cy="12" r="0.5" fill="#60a5fa" opacity="0.8"/>
  <circle cx="12" cy="12" r="0.5" fill="#60a5fa" opacity="0.8"/>
  
  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1d4ed8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>