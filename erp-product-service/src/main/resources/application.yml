server:
  port: 8002

spring:
  application:
    name: erp-product-service
  
  config:
    import: "optional:nacos:erp-product-service.yml"
  
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/erp_product?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
    username: root
    password: root123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 1
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
  
  elasticsearch:
    uris: http://localhost:9200
    username: ""
    password: ""
    connection-timeout: 5s
    socket-timeout: 30s
  
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: erp-system
        group: DEFAULT_GROUP
        metadata:
          version: 1.0.0
          zone: default
      config:
        server-addr: localhost:8848
        namespace: erp-system
        group: DEFAULT_GROUP
        file-extension: yml
        import-check:
          enabled: false



mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.erp.product.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    '[com.erp.product.mapper]': DEBUG
    '[org.springframework.web]': INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
  file:
    name: logs/erp-product-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 文件上传配置
app:
  file:
    upload:
      path: /data/uploads/products/
      max-size: 10MB
      allowed-types: jpg,jpeg,png,gif,webp