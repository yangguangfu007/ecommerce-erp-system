apiVersion: v1
kind: Namespace
metadata:
  name: erp-system
  labels:
    name: erp-system
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: erp-quota
  namespace: erp-system
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services: "20"
    secrets: "20"
    configmaps: "20"