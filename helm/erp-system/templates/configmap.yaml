apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "erp-system.labels" . | nindent 4 }}
data:
  application.yml: |
    server:
      port: ${SERVER_PORT:8080}
      shutdown: graceful
    
    spring:
      application:
        name: ${SPRING_APPLICATION_NAME:erp-service}
      profiles:
        active: ${SPRING_PROFILES_ACTIVE:k8s}
      
      datasource:
        url: jdbc:mysql://mysql:3306/erp_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          idle-timeout: 300000
          connection-timeout: 20000
          validation-timeout: 5000
      
      redis:
        host: redis
        port: 6379
        timeout: 2000ms
        lettuce:
          pool:
            max-active: 20
            max-idle: 10
            min-idle: 5
            max-wait: 2000ms
      
      kafka:
        bootstrap-servers: kafka:9092
        producer:
          retries: 3
          batch-size: 16384
          buffer-memory: 33554432
          key-serializer: org.apache.kafka.common.serialization.StringSerializer
          value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
        consumer:
          group-id: ${SPRING_APPLICATION_NAME:erp-service}
          auto-offset-reset: earliest
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
          properties:
            spring.json.trusted.packages: "com.erp.*"
      
      jpa:
        hibernate:
          ddl-auto: validate
        show-sql: false
        properties:
          hibernate:
            dialect: org.hibernate.dialect.MySQL8Dialect
            format_sql: true
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus,loggers
          base-path: /actuator
      endpoint:
        health:
          show-details: always
          probes:
            enabled: true
        metrics:
          enabled: true
        prometheus:
          enabled: true
      health:
        livenessstate:
          enabled: true
        readinessstate:
          enabled: true
      metrics:
        export:
          prometheus:
            enabled: true
        distribution:
          percentiles-histogram:
            http.server.requests: true
          slo:
            http.server.requests: 50ms,100ms,200ms,500ms
    
    logging:
      level:
        com.erp: INFO
        org.springframework.web: INFO
        org.hibernate.SQL: WARN
      pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
        file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
      file:
        name: /app/logs/application.log
        max-size: 100MB
        max-history: 30
    
    # Nacos configuration
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: {{ .Values.global.namespace }}
        group: DEFAULT_GROUP
        enabled: true
      config:
        server-addr: nacos:8848
        namespace: {{ .Values.global.namespace }}
        group: DEFAULT_GROUP
        enabled: false
    
    # Resilience4j configuration
    resilience4j:
      circuitbreaker:
        instances:
          default:
            sliding-window-size: 10
            minimum-number-of-calls: 5
            failure-rate-threshold: 50
            wait-duration-in-open-state: 30s
            permitted-number-of-calls-in-half-open-state: 3
      retry:
        instances:
          default:
            max-attempts: 3
            wait-duration: 1s
            exponential-backoff-multiplier: 2
      ratelimiter:
        instances:
          default:
            limit-for-period: 100
            limit-refresh-period: 1s
            timeout-duration: 0s