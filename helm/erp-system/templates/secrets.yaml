apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "erp-system.labels" . | nindent 4 }}
type: Opaque
data:
  # Database credentials
  DB_USERNAME: {{ .Values.mysql.auth.username | b64enc | quote }}
  DB_PASSWORD: {{ .Values.mysql.auth.password | b64enc | quote }}
  
  # JWT secret
  JWT_SECRET: {{ .Values.security.jwt.secret | b64enc | quote }}
  
  # External API credentials
  WALMART_API_KEY: {{ .Values.external.walmart.apiKey | b64enc | quote }}
  WALMART_API_SECRET: {{ .Values.external.walmart.apiSecret | b64enc | quote }}
  WALMART_CLIENT_ID: {{ .Values.external.walmart.clientId | b64enc | quote }}
  WALMART_CLIENT_SECRET: {{ .Values.external.walmart.clientSecret | b64enc | quote }}
  
  YUNEXPRESS_API_KEY: {{ .Values.external.yunexpress.apiKey | b64enc | quote }}
  YUNEXPRESS_API_SECRET: {{ .Values.external.yunexpress.apiSecret | b64enc | quote }}
  YUNEXPRESS_CUSTOMER_CODE: {{ .Values.external.yunexpress.customerCode | b64enc | quote }}
  
  # Notification credentials
  EMAIL_USERNAME: {{ .Values.notification.email.username | b64enc | quote }}
  EMAIL_PASSWORD: {{ .Values.notification.email.password | b64enc | quote }}
  SMS_API_KEY: {{ .Values.notification.sms.apiKey | b64enc | quote }}
  SMS_API_SECRET: {{ .Values.notification.sms.apiSecret | b64enc | quote }}